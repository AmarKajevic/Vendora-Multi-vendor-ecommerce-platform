name: Vendora CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vendora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, Verify & Build
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ==========================================================
      # NODE.JS
      # ==========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # ==========================================================
      # PNPM
      # ==========================================================

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      # ==========================================================
      # PNPM STORE CACHE
      # ==========================================================

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # ==========================================================
      # INSTALL
      # ==========================================================

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ==========================================================
      # ENVIRONMENT CHECK
      # ==========================================================

      - name: Check Node.js version
        run: node --version

      - name: Check pnpm version
        run: pnpm --version

      # ==========================================================
      # NX
      # ==========================================================

      - name: Nx report
        run: pnpm nx report

      - name: Show Nx projects
        run: pnpm nx show projects

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build all applications
        run: |
          pnpm nx run-many \
            --target=build \
            --all \
            --parallel=3 \
            --skip-nx-cache

      # ==========================================================
      # VERIFY BACKEND OUTPUTS
      # ==========================================================

      - name: Verify backend build outputs
        shell: bash
        run: |
          set -euo pipefail

          services=(
            api-gateway
            auth-service
            products-service
            seller-service
            order-service
            admin-service
            chatting-service
            recommendation-service
            logger-service
            kafka-service
          )

          echo ""
          echo "======================================================"
          echo "VERIFYING BACKEND BUILD OUTPUTS"
          echo "======================================================"

          for service in "${services[@]}"; do

            dist_dir="apps/$service/dist"

            if [ ! -d "$dist_dir" ]; then
              echo "ERROR: $dist_dir does not exist"
              exit 1
            fi

            if [ -z "$(find "$dist_dir" -type f -print -quit)" ]; then
              echo "ERROR: $dist_dir is empty"
              exit 1
            fi

            echo "OK: $dist_dir"

          done

          echo ""
          echo "======================================================"
          echo "BUILD VERIFICATION SUCCESSFUL"
          echo "======================================================"