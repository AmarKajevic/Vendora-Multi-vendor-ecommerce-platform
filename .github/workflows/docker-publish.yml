name: Vendora Docker Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vendora-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_USERNAME: amar997

jobs:
  # ============================================================
  # BUILD APPLICATIONS
  # ============================================================

  build:
    name: Build Applications
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ==========================================================
      # NODE.JS
      # ==========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # ==========================================================
      # PNPM
      # ==========================================================

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      # ==========================================================
      # PNPM STORE CACHE
      # ==========================================================

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # ==========================================================
      # INSTALL DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ==========================================================
      # BUILD ALL APPLICATIONS
      #
      # --skip-nx-cache is intentional.
      #
      # The Docker job needs the physical dist directories
      # generated on this runner.
      # ==========================================================

      - name: Build all applications
        run: |
          pnpm nx run-many \
            --target=build \
            --all \
            --parallel=3 \
            --skip-nx-cache

      # ==========================================================
      # VERIFY BACKEND BUILD OUTPUTS
      # ==========================================================

      - name: Verify backend build outputs
        shell: bash
        run: |
          set -euo pipefail

          services=(
            api-gateway
            auth-service
            products-service
            seller-service
            order-service
            admin-service
            chatting-service
            recommendation-service
            logger-service
            kafka-service
          )

          echo ""
          echo "======================================================"
          echo "BACKEND BUILD OUTPUT VERIFICATION"
          echo "======================================================"

          for service in "${services[@]}"; do

            dist_dir="apps/$service/dist"

            echo ""
            echo "Checking: $dist_dir"

            if [ ! -d "$dist_dir" ]; then
              echo "ERROR: $dist_dir does not exist"
              exit 1
            fi

            if [ -z "$(find "$dist_dir" -type f -print -quit)" ]; then
              echo "ERROR: $dist_dir exists but is empty"
              exit 1
            fi

            echo "OK: $dist_dir"

            echo "Files:"
            find "$dist_dir" -maxdepth 2 -type f | head -20

          done

          echo ""
          echo "======================================================"
          echo "ALL BACKEND BUILD OUTPUTS ARE VALID"
          echo "======================================================"

      # ==========================================================
      # CREATE BACKEND DIST ARCHIVE
      #
      # Instead of relying on artifact directory hierarchy,
      # package the exact required structure into a tar.gz file.
      #
      # Result:
      #
      # vendora-backend-dist.tar.gz
      #
      # containing:
      #
      # api-gateway/dist/...
      # auth-service/dist/...
      # products-service/dist/...
      # ...
      # ==========================================================

      - name: Create backend dist archive
        shell: bash
        run: |
          set -euo pipefail

          services=(
            api-gateway
            auth-service
            products-service
            seller-service
            order-service
            admin-service
            chatting-service
            recommendation-service
            logger-service
            kafka-service
          )

          echo ""
          echo "======================================================"
          echo "CREATING BACKEND DIST ARCHIVE"
          echo "======================================================"

          rm -f vendora-backend-dist.tar.gz

          tar -czf vendora-backend-dist.tar.gz \
            -C apps \
            "${services[@]/%//dist}"

          echo ""
          echo "Archive created:"
          ls -lh vendora-backend-dist.tar.gz

          echo ""
          echo "Archive contents:"
          tar -tzf vendora-backend-dist.tar.gz | head -100

          echo ""
          echo "======================================================"
          echo "BACKEND DIST ARCHIVE CREATED SUCCESSFULLY"
          echo "======================================================"

      # ==========================================================
      # UPLOAD BACKEND DIST ARCHIVE
      # ==========================================================

      - name: Upload backend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendora-backend-dist
          path: vendora-backend-dist.tar.gz
          retention-days: 1
          if-no-files-found: error


  # ============================================================
  # DOCKER BUILD & PUSH
  # ============================================================

  docker:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest

    needs:
      - build

    strategy:
      fail-fast: false

      matrix:
        include:

          # ------------------------------------------------------
          # BACKEND SERVICES
          # ------------------------------------------------------

          - name: api-gateway
            image: amar997/vendora-api-gateway
            dockerfile: apps/api-gateway/Dockerfile

          - name: auth-service
            image: amar997/vendora-auth-service
            dockerfile: apps/auth-service/Dockerfile

          - name: products-service
            image: amar997/vendora-products-service
            dockerfile: apps/products-service/Dockerfile

          - name: seller-service
            image: amar997/vendora-seller-service
            dockerfile: apps/seller-service/Dockerfile

          - name: order-service
            image: amar997/vendora-order-service
            dockerfile: apps/order-service/Dockerfile

          - name: admin-service
            image: amar997/vendora-admin-service
            dockerfile: apps/admin-service/Dockerfile

          - name: chatting-service
            image: amar997/vendora-chatting-service
            dockerfile: apps/chatting-service/Dockerfile

          - name: recommendation-service
            image: amar997/vendora-recommendation-service
            dockerfile: apps/recommendation-service/Dockerfile

          - name: logger-service
            image: amar997/vendora-logger-service
            dockerfile: apps/logger-service/Dockerfile

          - name: kafka-service
            image: amar997/vendora-kafka-service
            dockerfile: apps/kafka-service/Dockerfile

          # ------------------------------------------------------
          # FRONTEND APPLICATIONS
          # ------------------------------------------------------

          - name: user-ui
            image: amar997/vendora-user-ui
            dockerfile: apps/user-ui/Dockerfile

          - name: seller-ui
            image: amar997/vendora-seller-ui
            dockerfile: apps/seller-ui/Dockerfile

          - name: admin-ui
            image: amar997/vendora-admin-ui
            dockerfile: apps/admin-ui/Dockerfile


    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ==========================================================
      # DOWNLOAD BACKEND DIST ARCHIVE
      # ==========================================================

      - name: Download backend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: vendora-backend-dist
          path: .

      # ==========================================================
      # VERIFY ARTIFACT
      # ==========================================================

      - name: Verify downloaded artifact
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "======================================================"
          echo "VERIFYING DOWNLOADED ARTIFACT"
          echo "======================================================"

          if [ ! -f "vendora-backend-dist.tar.gz" ]; then
            echo "ERROR: vendora-backend-dist.tar.gz was not downloaded"
            exit 1
          fi

          echo "Artifact:"
          ls -lh vendora-backend-dist.tar.gz

          echo ""
          echo "Artifact contents:"
          tar -tzf vendora-backend-dist.tar.gz | head -100

          echo ""
          echo "======================================================"
          echo "ARTIFACT VERIFIED"
          echo "======================================================"

      # ==========================================================
      # RESTORE BACKEND DIST DIRECTLY INTO apps/
      #
      # The archive was created with:
      #
      # -C apps
      #
      # Therefore extracting it into:
      #
      # apps/
      #
      # restores:
      #
      # apps/api-gateway/dist
      # apps/auth-service/dist
      # ...
      # ==========================================================

      - name: Restore backend dist
        shell: bash
        run: |
          set -euo pipefail

          services=(
            api-gateway
            auth-service
            products-service
            seller-service
            order-service
            admin-service
            chatting-service
            recommendation-service
            logger-service
            kafka-service
          )

          echo ""
          echo "======================================================"
          echo "RESTORING BACKEND DIST DIRECTORIES"
          echo "======================================================"

          tar -xzf vendora-backend-dist.tar.gz -C apps

          echo ""
          echo "Verifying restored directories..."

          for service in "${services[@]}"; do

            dist_dir="apps/$service/dist"

            echo ""
            echo "Checking: $dist_dir"

            if [ ! -d "$dist_dir" ]; then
              echo "ERROR: $dist_dir does not exist after extraction"
              exit 1
            fi

            if [ -z "$(find "$dist_dir" -type f -print -quit)" ]; then
              echo "ERROR: $dist_dir is empty after extraction"
              exit 1
            fi

            echo "OK: $dist_dir"

          done

          echo ""
          echo "======================================================"
          echo "BACKEND DIST RESTORED SUCCESSFULLY"
          echo "======================================================"

      # ==========================================================
      # DOCKER BUILDX
      # ==========================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ==========================================================
      # DOCKER HUB LOGIN
      # ==========================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================================
      # DOCKER IMAGE METADATA
      # ==========================================================

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      # ==========================================================
      # BUILD & PUSH
      # ==========================================================

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max