name: Vendora Docker Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vendora-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_USERNAME: amar997

jobs:

  # ============================================================
  # BUILD APPLICATIONS
  # ============================================================

  build:
    name: Build Applications
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ==========================================================
      # NODE.JS
      # ==========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # ==========================================================
      # PNPM
      # ==========================================================

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      # ==========================================================
      # PNPM CACHE
      # ==========================================================

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # ==========================================================
      # INSTALL DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ==========================================================
      # BUILD ALL APPLICATIONS
      #
      # We intentionally skip the Nx cache here.
      #
      # Backend Dockerfiles require:
      #
      # apps/<service>/dist
      #
      # to physically exist on the GitHub runner.
      # ==========================================================

      - name: Build all applications
        run: pnpm nx run-many --target=build --all --parallel=3 --skip-nx-cache

      # ==========================================================
      # VERIFY BACKEND BUILD OUTPUTS
      # ==========================================================

      - name: Verify backend build outputs
        shell: bash
        run: |
          set -euo pipefail

          services=(
            api-gateway
            auth-service
            products-service
            seller-service
            order-service
            admin-service
            chatting-service
            recommendation-service
            logger-service
            kafka-service
          )

          echo "=========================================="
          echo "BACKEND BUILD OUTPUT VERIFICATION"
          echo "=========================================="

          echo ""
          echo "All dist directories found:"
          find apps -type d -name dist -print

          echo ""
          echo "Checking required backend services..."

          for service in "${services[@]}"; do

            echo ""
            echo "------------------------------------------"
            echo "Checking: apps/$service/dist"
            echo "------------------------------------------"

            if [ ! -d "apps/$service/dist" ]; then
              echo "ERROR: apps/$service/dist does not exist"
              exit 1
            fi

            if [ -z "$(find "apps/$service/dist" -type f -print -quit)" ]; then
              echo "ERROR: apps/$service/dist exists but is empty"
              exit 1
            fi

            echo "OK: apps/$service/dist"

            echo "Files:"
            find "apps/$service/dist" -maxdepth 2 -type f | head -20

          done

          echo ""
          echo "=========================================="
          echo "ALL BACKEND BUILD OUTPUTS ARE VALID"
          echo "=========================================="

      # ==========================================================
      # PREPARE BACKEND DIST ARTIFACT
      #
      # We create a controlled artifact structure:
      #
      # .ci-dist/
      # └── apps/
      #     ├── api-gateway/
      #     │   └── dist/
      #     ├── auth-service/
      #     │   └── dist/
      #     ├── products-service/
      #     │   └── dist/
      #     └── ...
      #
      # This structure is restored in the Docker job.
      # ==========================================================

      - name: Prepare backend dist artifact
        shell: bash
        run: |
          set -euo pipefail

          services=(
            api-gateway
            auth-service
            products-service
            seller-service
            order-service
            admin-service
            chatting-service
            recommendation-service
            logger-service
            kafka-service
          )

          echo "=========================================="
          echo "PREPARING BACKEND DIST ARTIFACT"
          echo "=========================================="

          rm -rf .ci-dist
          mkdir -p .ci-dist/apps

          for service in "${services[@]}"; do

            echo ""
            echo "Preparing $service..."

            source_dir="apps/$service/dist"
            target_dir=".ci-dist/apps/$service/dist"

            if [ ! -d "$source_dir" ]; then
              echo "ERROR: $source_dir does not exist"
              exit 1
            fi

            mkdir -p ".ci-dist/apps/$service"

            cp -R "$source_dir" "$target_dir"

            echo "Copied:"
            echo "  $source_dir"
            echo "  -> $target_dir"

          done

          echo ""
          echo "=========================================="
          echo "VERIFYING .ci-dist"
          echo "=========================================="

          if [ ! -d ".ci-dist/apps" ]; then
            echo "ERROR: .ci-dist/apps was not created"
            exit 1
          fi

          echo ""
          echo "Directories:"
          find .ci-dist/apps -type d -print

          echo ""
          echo "Files:"
          find .ci-dist/apps -type f | head -100

          echo ""
          echo "=========================================="
          echo "BACKEND ARTIFACT PREPARATION SUCCESSFUL"
          echo "=========================================="

      # ==========================================================
      # UPLOAD BACKEND DIST ARTIFACT
      # ==========================================================

      - name: Upload backend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendora-dist
          path: .ci-dist
          retention-days: 1
          if-no-files-found: error


  # ============================================================
  # DOCKER BUILD & PUBLISH
  # ============================================================

  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - build

    strategy:
      fail-fast: false

      matrix:
        include:

          # ------------------------------------------------------
          # BACKEND SERVICES
          # ------------------------------------------------------

          - name: api-gateway
            image: amar997/vendora-api-gateway
            dockerfile: apps/api-gateway/Dockerfile

          - name: auth-service
            image: amar997/vendora-auth-service
            dockerfile: apps/auth-service/Dockerfile

          - name: products-service
            image: amar997/vendora-products-service
            dockerfile: apps/products-service/Dockerfile

          - name: seller-service
            image: amar997/vendora-seller-service
            dockerfile: apps/seller-service/Dockerfile

          - name: order-service
            image: amar997/vendora-order-service
            dockerfile: apps/order-service/Dockerfile

          - name: admin-service
            image: amar997/vendora-admin-service
            dockerfile: apps/admin-service/Dockerfile

          - name: chatting-service
            image: amar997/vendora-chatting-service
            dockerfile: apps/chatting-service/Dockerfile

          - name: recommendation-service
            image: amar997/vendora-recommendation-service
            dockerfile: apps/recommendation-service/Dockerfile

          - name: logger-service
            image: amar997/vendora-logger-service
            dockerfile: apps/logger-service/Dockerfile

          - name: kafka-service
            image: amar997/vendora-kafka-service
            dockerfile: apps/kafka-service/Dockerfile

          # ------------------------------------------------------
          # FRONTEND APPLICATIONS
          # ------------------------------------------------------

          - name: user-ui
            image: amar997/vendora-user-ui
            dockerfile: apps/user-ui/Dockerfile

          - name: seller-ui
            image: amar997/vendora-seller-ui
            dockerfile: apps/seller-ui/Dockerfile

          - name: admin-ui
            image: amar997/vendora-admin-ui
            dockerfile: apps/admin-ui/Dockerfile


    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ==========================================================
      # DOWNLOAD BACKEND DIST ARTIFACT
      # ==========================================================

      - name: Download backend dist
        uses: actions/download-artifact@v4
        with:
          name: vendora-dist
          path: .ci-dist

      # ==========================================================
      # RESTORE BACKEND DIST
      #
      # Downloaded:
      #
      # .ci-dist/apps/api-gateway/dist
      #
      # Restored to:
      #
      # apps/api-gateway/dist
      #
      # This is exactly what the backend Dockerfiles expect.
      # ==========================================================

      - name: Restore backend dist
        shell: bash
        run: |
          set -euo pipefail

          services=(
            api-gateway
            auth-service
            products-service
            seller-service
            order-service
            admin-service
            chatting-service
            recommendation-service
            logger-service
            kafka-service
          )

          echo "=========================================="
          echo "DOWNLOADED ARTIFACT"
          echo "=========================================="

          if [ ! -d ".ci-dist" ]; then
            echo "ERROR: .ci-dist does not exist"
            exit 1
          fi

          find .ci-dist -type d -print

          echo ""
          echo "=========================================="
          echo "RESTORING BACKEND DIST DIRECTORIES"
          echo "=========================================="

          if [ ! -d ".ci-dist/apps" ]; then
            echo "ERROR: .ci-dist/apps does not exist"
            exit 1
          fi

          cp -R .ci-dist/apps/. apps/

          echo ""
          echo "=========================================="
          echo "VERIFYING RESTORED DIST DIRECTORIES"
          echo "=========================================="

          for service in "${services[@]}"; do

            dist_dir="apps/$service/dist"

            if [ ! -d "$dist_dir" ]; then
              echo "ERROR: $dist_dir is missing"
              exit 1
            fi

            if [ -z "$(find "$dist_dir" -type f -print -quit)" ]; then
              echo "ERROR: $dist_dir is empty"
              exit 1
            fi

            echo "OK: $dist_dir"

          done

          echo ""
          echo "=========================================="
          echo "BACKEND DIST RESTORED SUCCESSFULLY"
          echo "=========================================="

      # ==========================================================
      # DOCKER BUILDX
      # ==========================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ==========================================================
      # DOCKER HUB LOGIN
      # ==========================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: amar997
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================================
      # DOCKER METADATA
      # ==========================================================

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      # ==========================================================
      # BUILD & PUSH DOCKER IMAGE
      # ==========================================================

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max