name: Vendora Docker Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vendora-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_USERNAME: amar997

jobs:

  # ============================================================
  # BUILD APPLICATIONS
  # ============================================================

  build:
    name: Build Applications
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ==========================================================
      # NODE
      # ==========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # ==========================================================
      # PNPM
      # ==========================================================

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      # ==========================================================
      # PNPM CACHE
      # ==========================================================

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # ==========================================================
      # INSTALL
      # ==========================================================

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ==========================================================
      # BUILD
      #
      # Backend Dockerfiles expect:
      #
      # apps/<service>/dist
      #
      # Therefore Nx must build the applications before Docker.
      # ==========================================================

      - name: Build all applications
        run: pnpm build

      # ==========================================================
      # VERIFY BUILD OUTPUTS
      # ==========================================================

      - name: Verify backend build outputs
        shell: bash
        run: |
          set -e

          services=(
            api-gateway
            auth-service
            products-service
            seller-service
            order-service
            admin-service
            chatting-service
            recommendation-service
            logger-service
            kafka-service
          )

          echo "=========================================="
          echo "VERIFYING BACKEND BUILD OUTPUTS"
          echo "=========================================="

          for service in "${services[@]}"; do

            echo ""
            echo "Checking: apps/$service/dist"

            if [ ! -d "apps/$service/dist" ]; then
              echo "ERROR: apps/$service/dist does not exist"
              exit 1
            fi

            echo "OK: apps/$service/dist"

            find "apps/$service/dist" -maxdepth 2 -type f | head -20

          done

          echo ""
          echo "=========================================="
          echo "ALL BACKEND BUILD OUTPUTS ARE PRESENT"
          echo "=========================================="

      # ==========================================================
      # PREPARE BACKEND DIST ARTIFACT
      #
      # We explicitly create the structure that Docker expects:
      #
      # .ci-dist/
      #   apps/
      #     api-gateway/dist
      #     auth-service/dist
      #     ...
      # ==========================================================

      - name: Prepare backend dist artifact
        shell: bash
        run: |
          set -e

          rm -rf .ci-dist

          mkdir -p .ci-dist/apps

          services=(
            api-gateway
            auth-service
            products-service
            seller-service
            order-service
            admin-service
            chatting-service
            recommendation-service
            logger-service
            kafka-service
          )

          echo "=========================================="
          echo "PREPARING BACKEND DIST ARTIFACT"
          echo "=========================================="

          for service in "${services[@]}"; do

            echo ""
            echo "Preparing $service..."

            if [ ! -d "apps/$service/dist" ]; then
              echo "ERROR: apps/$service/dist does not exist"
              exit 1
            fi

            mkdir -p ".ci-dist/apps/$service"

            cp -R "apps/$service/dist" \
              ".ci-dist/apps/$service/"

            echo "Copied: apps/$service/dist"

          done

          echo ""
          echo "=========================================="
          echo "ARTIFACT DIRECTORIES"
          echo "=========================================="

          find .ci-dist/apps -maxdepth 3 -type d -print

          echo ""
          echo "=========================================="
          echo "ARTIFACT FILES"
          echo "=========================================="

          find .ci-dist/apps -type f | head -100

      # ==========================================================
      # UPLOAD BACKEND DIST ARTIFACT
      # ==========================================================

      - name: Upload backend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendora-dist
          path: .ci-dist
          retention-days: 1
          if-no-files-found: error


  # ============================================================
  # DOCKER PUBLISH
  # ============================================================

  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - build

    strategy:
      fail-fast: false

      matrix:
        include:

          # ------------------------------------------------------
          # BACKEND SERVICES
          # ------------------------------------------------------

          - name: api-gateway
            image: amar997/vendora-api-gateway
            dockerfile: apps/api-gateway/Dockerfile

          - name: auth-service
            image: amar997/vendora-auth-service
            dockerfile: apps/auth-service/Dockerfile

          - name: products-service
            image: amar997/vendora-products-service
            dockerfile: apps/products-service/Dockerfile

          - name: seller-service
            image: amar997/vendora-seller-service
            dockerfile: apps/seller-service/Dockerfile

          - name: order-service
            image: amar997/vendora-order-service
            dockerfile: apps/order-service/Dockerfile

          - name: admin-service
            image: amar997/vendora-admin-service
            dockerfile: apps/admin-service/Dockerfile

          - name: chatting-service
            image: amar997/vendora-chatting-service
            dockerfile: apps/chatting-service/Dockerfile

          - name: recommendation-service
            image: amar997/vendora-recommendation-service
            dockerfile: apps/recommendation-service/Dockerfile

          - name: logger-service
            image: amar997/vendora-logger-service
            dockerfile: apps/logger-service/Dockerfile

          - name: kafka-service
            image: amar997/vendora-kafka-service
            dockerfile: apps/kafka-service/Dockerfile

          # ------------------------------------------------------
          # FRONTEND APPLICATIONS
          # ------------------------------------------------------

          - name: user-ui
            image: amar997/vendora-user-ui
            dockerfile: apps/user-ui/Dockerfile

          - name: seller-ui
            image: amar997/vendora-seller-ui
            dockerfile: apps/seller-ui/Dockerfile

          - name: admin-ui
            image: amar997/vendora-admin-ui
            dockerfile: apps/admin-ui/Dockerfile


    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ==========================================================
      # DOWNLOAD BACKEND DIST ARTIFACT
      # ==========================================================

      - name: Download backend dist
        uses: actions/download-artifact@v4
        with:
          name: vendora-dist
          path: .ci-dist

      # ==========================================================
      # RESTORE BACKEND DIST
      #
      # Artifact:
      #
      # .ci-dist/apps/api-gateway/dist
      #
      # becomes:
      #
      # apps/api-gateway/dist
      #
      # which is exactly what the Dockerfiles expect.
      # ==========================================================

      - name: Restore backend dist
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOADED ARTIFACT"
          echo "=========================================="

          find .ci-dist -maxdepth 4 -type d -print

          echo ""
          echo "=========================================="
          echo "RESTORING APPS DIRECTORY"
          echo "=========================================="

          if [ ! -d ".ci-dist/apps" ]; then
            echo "ERROR: .ci-dist/apps does not exist"
            exit 1
          fi

          cp -R .ci-dist/apps/. apps/

          echo ""
          echo "=========================================="
          echo "VERIFYING RESTORED BACKEND DIST"
          echo "=========================================="

          services=(
            api-gateway
            auth-service
            products-service
            seller-service
            order-service
            admin-service
            chatting-service
            recommendation-service
            logger-service
            kafka-service
          )

          for service in "${services[@]}"; do

            if [ ! -d "apps/$service/dist" ]; then
              echo "ERROR: apps/$service/dist is missing"
              exit 1
            fi

            echo "OK: apps/$service/dist"

          done

          echo ""
          echo "=========================================="
          echo "BACKEND DIST RESTORED SUCCESSFULLY"
          echo "=========================================="

      # ==========================================================
      # DOCKER BUILDX
      # ==========================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ==========================================================
      # DOCKER HUB LOGIN
      # ==========================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: amar997
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================================
      # DOCKER METADATA
      # ==========================================================

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      # ==========================================================
      # BUILD & PUSH
      # ==========================================================

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max