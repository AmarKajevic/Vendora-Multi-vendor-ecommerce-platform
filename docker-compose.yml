      KAFKA_BROKERS: kafka:29092

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "6002:6002"

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"


  # ============================================================
