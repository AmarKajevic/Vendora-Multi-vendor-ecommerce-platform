services:

  # ============================================================
  # NGINX
  # ============================================================

  nginx:
    image: nginx:alpine
    container_name: vendora-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - api-gateway
      - user-ui
      - seller-ui
      - admin-ui

    restart: unless-stopped


  # ============================================================
  # ZOOKEEPER
  # ============================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: vendora-zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.2"


  # ============================================================
  # KAFKA
  # ============================================================

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: vendora-kafka

    depends_on:
      zookeeper:
        condition: service_started

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:29092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"


  # ============================================================
  # KAFKA TOPIC SETUP
  # ============================================================

  kafka-setup:
    image: confluentinc/cp-kafka:7.4.0
    container_name: vendora-kafka-setup

    depends_on:
      kafka:
        condition: service_healthy

    command: >
      bash -c "
        echo 'Creating Kafka topics...';

        kafka-topics
        --create
        --if-not-exists
        --topic user-events
        --bootstrap-server kafka:29092;

        kafka-topics
        --create
        --if-not-exists
        --topic logs
        --bootstrap-server kafka:29092;

        kafka-topics
        --create
        --if-not-exists
        --topic chat.new_message
        --bootstrap-server kafka:29092;

        echo 'Kafka topics ready';
      "

    restart: "no"


  # ============================================================
  # API GATEWAY
  # ============================================================

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile

    image: vendora/api-gateway:local
    container_name: vendora-api-gateway

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 8080
      KAFKA_BROKERS: kafka:29092

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "8080:8080"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"


  # ============================================================
  # AUTH SERVICE
  # ============================================================

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile

    image: vendora/auth-service:local
    container_name: vendora-auth-service

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 6001
      KAFKA_BROKERS: kafka:29092

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "6001:6001"

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"


  # ============================================================
  # PRODUCT SERVICE
  # ============================================================

  products-service:
    build:
      context: .
      dockerfile: apps/products-service/Dockerfile

    image: vendora/product-service:local
