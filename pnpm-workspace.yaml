packages:
  - "apps/*"
  - "packages/components"
  - "packages/error-handler"
  - "packages/libs/*"
  - "packages/middleware"
  - "packages/utils/*"
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  '@tensorflow/tfjs-node': true
  bcrypt: true
  esbuild: true
  less: true
  nx: true
  prisma: true
  sharp: true
  unrs-resolver: true
